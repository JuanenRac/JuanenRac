name: Bootstrap HYDRA-UMC Roadmap

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Create or reconcile the public Project and its structure.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  bootstrap:
    name: Create or reconcile ecosystem Project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap source
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            tools/bootstrap_ecosystem_project.py
          sparse-checkout-cone-mode: false
      - name: Bootstrap HYDRA-UMC Roadmap
        env:
          HYDRA_UMC_PROJECTS_TOKEN: ${{ secrets.HYDRA_UMC_PROJECTS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HYDRA_UMC_PROJECTS_TOKEN" || {
            echo '::error::HYDRA_UMC_PROJECTS_TOKEN is not configured.'
            exit 1
          }
          if [[ '${{ inputs.apply }}' == 'true' ]]; then
            python3 tools/bootstrap_ecosystem_project.py --apply
          else
            python3 tools/bootstrap_ecosystem_project.py
          fi
