#
# Regenerates docs/index.html (scripts/generate_dashboard.py) and commits
# it if it changed - audit idea: "Implementar un Dashboard centralizado
# que muestre el estado de build de los 44 repositorios en tiempo real"
# (SONNET/AUDITORIA_COMPLETA_44_PROYECTOS.txt). "En tiempo real" here
# means "as fresh as the last scheduled run" - a static GitHub Pages
# site has no server process to hold a live connection open; see the
# schedule below for how often that actually is.
#
# ONE MANUAL STEP NEEDED before this is actually visible anywhere (not
# done in this session - changing repo-level settings isn't something to
# do unprompted): Settings -> Pages -> Source: "Deploy from a branch",
# Branch: main, folder: /docs. After that, the live page is at
# https://juanenrac.github.io/JuanenRac/ - GitHub Pages itself then
# serves whatever this workflow last committed, no separate hosting
# needed (GitHub's own Pages infrastructure, free for a public repo).
# =============================================================================
name: Build ecosystem status dashboard

on:
  workflow_dispatch: {} # manual "Run workflow" button - the recommended way to do the first real run, once Pages is enabled per this file's own header comment
  push:
    branches: [main]
    paths:
      - "scripts/generate_dashboard.py"
      - ".github/workflows/build-dashboard.yml"
  schedule:
    - cron: "0 8 * * *" # daily, 08:00 UTC - each of the 45 repos rarely bumps its own version more than once or twice a day even during an active work session

permissions:
  contents: write # this workflow commits docs/index.html back to main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Installed straight from GitHub, not vendored/copied - see this
      # workflow's own directory README/generate_dashboard.py's own
      # header for why (one real registry, not a second copy of it here).
      - name: Install HYDRA-UMC-UPDATER
        run: pip install "git+https://github.com/JuanenRac/HYDRA-UMC-UPDATER.git"

      - name: Generate the dashboard
        run: python scripts/generate_dashboard.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/.nojekyll
          git diff --cached --quiet && echo "No changes - nothing to commit." && exit 0
          git commit -m "docs: regenerate ecosystem status dashboard"
          git push
