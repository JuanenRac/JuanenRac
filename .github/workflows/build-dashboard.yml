#
# Builds the central ecosystem status dashboard and publishes it through
# GitHub Pages from main/docs.
#
# Two jobs, so that the permission to write exists only where it is needed:
#
#   build    (every trigger, read-only token) tests, generates and checks the
#            dashboard and the README files, then reconciles the figures of the
#            ecosystem (scripts/ecosystem_integrity_test.py). On a pull request
#            this is all that runs: nothing is published.
#   publish  (only main, the schedule, a dispatch and a manual run; the only job
#            with contents: write) commits what the build job generated.
#
# Architecture:
#
#   hydra_umc_updater.github_client   urtc_updater.github_client   armor_updater.github_client
#        |                                  |                              |
#        +----------------------------------+------------------------------+
#                                            v
#                                  generate_dashboard.py
#                                            |
#                                            v
#                                     docs/index.html
#                                            |
#                                            v
#                                     GitHub Pages
#
# Three real, independent ecosystems by the same author - HYDRA-UMC, URTC
# and A.R.M.O.R. - each discovered live through its own dedicated updater
# package, merged into one dashboard. Each repository's own manifest
# (hydra-umc.project.json / urtc.project.json / armor.project.json,
# depending which ecosystem it belongs to) is the single source of truth
# for its metadata and version. The workflow discovers GitHub repositories
# at runtime; it contains no project list.
#
# The generated HTML deliberately contains no generation timestamp. This is
# important: if a timestamp were written on every scheduled execution, the
# generated file would always change and this workflow would create an
# unnecessary commit every day even when nothing in the ecosystem changed.
#
# GitHub Pages:
#
#   Repository Settings
#   -> Pages
#   -> Source: Deploy from a branch
#   -> Branch: main
#   -> Folder: /docs
#
# Live page:
#
#   https://juanenrac.github.io/JuanenRac/
# =============================================================================

name: Build ecosystem status dashboard

on:
  workflow_dispatch:

  # Immediate refresh requested by a project after a push to its main branch.
  # Payload data is informational only: the generator still discovers and
  # validates every public manifest itself before publishing the dashboard.
  repository_dispatch:
    types:
      - ecosystem_project_updated
      # A build of a repository of the ecosystem has ended (sent by that repository's own dashboard-dispatch.yml, see docs/DASHBOARD_UPDATES.md).
      # The "gate" job lets it through only for a repository of this owner and not more often than the minimum interval, so a busy day of builds cannot
      # chain regenerations.
      - ecosystem_build_finished

  push:
    branches:
      - main
    paths:
      - "scripts/generate_dashboard.py"
      - "scripts/dashboard_*.py"
      - "scripts/sync_readme_versions.py"
      - "scripts/ecosystem_progress.py"
      - "scripts/ecosystem_integrity_test.py"
      - "scripts/sync_readme_descriptions.py"
      - "ecosystem-descriptions.json"
      - "scripts/catalog_check.py"
      - "ecosystem-catalog.json"
      - "dashboard-config.json"
      - "code-stats-config.json"
      - "docs/evidence-schema.json"
      - ".github/workflows/build-dashboard.yml"

  # The same build, never published: it proves that a change still generates the dashboard and passes the tests.
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "e2e/fixture/**"
      - "ecosystem-descriptions.json"
      - "ecosystem-catalog.json"
      - "dashboard-config.json"
      - "code-stats-config.json"
      - "docs/evidence-schema.json"
      - ".github/workflows/build-dashboard.yml"

  schedule:
    # Safety-net discovery twice an hour: a newly pushed manifest repository
    # appears without editing this repository or maintaining a project list.
    # The push-triggered refresh (repository_dispatch from each project's own
    # dashboard-dispatch.yml, which needs the ECOSYSTEM_DASHBOARD_DISPATCH_TOKEN
    # secret) is the real, immediate path, so the schedule only has to catch
    # what a dispatch missed. Two slots an hour instead of three: GitHub skips
    # some scheduled runs when busy (a single hourly slot once went hours
    # without running), but three regenerations an hour mostly produced
    # back-to-back bot commits for the same change.
    - cron: "17,47 * * * *"

# Prevent two dashboard builds from modifying main at the same time. A pull request
# has a group of its own, so it can neither wait for nor replace a publishing run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ecosystem-dashboard-pr-{0}', github.event.number) || 'ecosystem-dashboard' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No permission by default: every job asks for exactly what it needs.
permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # Gate: filters and rate-limits the event "a build of the ecosystem has ended"
  # ---------------------------------------------------------------------------
  # Every other trigger passes at once. For the build-finished event the payload is only checked (it is never used as data): the repository must belong
  # to this owner and must not be this repository (its own builds would chain), and the last finished run of this workflow must be older than
  # MIN_MINUTES. The twice-an-hour schedule picks up whatever was skipped. No third-party action, no secret and read-only.
  gate:
    name: Decide whether this run is needed
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      go: ${{ steps.decide.outputs.go }}
    steps:
      - name: Filter and rate-limit
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          SOURCE_REPO: ${{ github.event.client_payload.repository }}
          THIS_REPO: ${{ github.repository }}
          MIN_MINUTES: "15"
        shell: bash
        run: |
          set -u
          go=true
          if [ "$EVENT_NAME" = "repository_dispatch" ] && [ "$EVENT_ACTION" = "ecosystem_build_finished" ]; then
            owner="${THIS_REPO%%/*}"
            if ! printf '%s' "$SOURCE_REPO" | grep -Eq "^${owner}/[A-Za-z0-9._-]+$" || [ "$SOURCE_REPO" = "$THIS_REPO" ]; then
              echo "Skipped: the repository in the notification is not another repository of $owner."
              go=false
            else
              last=$(gh api "repos/${THIS_REPO}/actions/workflows/build-dashboard.yml/runs?status=completed&per_page=1" --jq '.workflow_runs[0].created_at // empty' 2>/dev/null || true)
              if [ -n "$last" ]; then
                age=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 60 ))
                if [ "$age" -lt "$MIN_MINUTES" ]; then
                  echo "Skipped: the dashboard was built ${age} minutes ago (minimum ${MIN_MINUTES}); the schedule will catch up."
                  go=false
                fi
              fi
            fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "Run needed: $go"

  build:
    name: Generate ecosystem dashboard
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # -----------------------------------------------------------------------
      # Checkout
      # -----------------------------------------------------------------------
      # checkout v6 runs on Node.js 24 and avoids the old Node.js 20 warning.
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      # -----------------------------------------------------------------------
      # Python
      # -----------------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      # -----------------------------------------------------------------------
      # Install the ecosystem updater
      # -----------------------------------------------------------------------
      # The updater supplies the shared manifest parser and dynamic GitHub
      # discovery implementation. No project catalogue is installed here.
      # -----------------------------------------------------------------------
      - name: Install HYDRA-UMC-UPDATER
        # CAT-01 (P2): this used to install directly from main with no revision
        # pin - a mutable dependency where main could get a real behavior
        # change (or a genuine regression) between one scheduled run and
        # the next, silently, with no way to tell which commit a given
        # dashboard build actually used. Pinned to a real, current commit
        # SHA (HYDRA-UMC-UPDATER's own main at the time of this fix) -
        # bump this SHA by hand (a real, deliberate action, not silent
        # drift) whenever this repo wants a newer UPDATER behavior.
        #
        # This SHA is re-pinned to HYDRA-UMC-UPDATER's own new single
        # root commit after every ecosystem-wide repository/history reset
        # (the same one every other pin like this needs updating for,
        # anywhere it exists in this ecosystem) - a prior reset commit
        # this line pinned no longer exists once that repo's own history
        # is replaced, and pip's own git+https install fails outright
        # (`fatal: remote error: upload-pack: not our ref <sha>`) rather
        # than silently falling back to anything.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/JuanenRac/HYDRA-UMC-UPDATER.git@5eab96284f4ca83e7f50ed38c8bc6e32a9c67f7a"

      # -----------------------------------------------------------------------
      # Install URTC-UPDATER and ARMOR-UPDATER
      # -----------------------------------------------------------------------
      # URTC and A.R.M.O.R. are two more real, independent, now-public
      # ecosystems by the same author, each with its own dedicated
      # discovery client - same pinned-SHA convention as HYDRA-UMC-UPDATER
      # above, and for the same reason (a mutable `@main` dependency could
      # change this dashboard's behavior silently between runs). Bump
      # these SHAs by hand, and re-pin after either repository's own
      # history is ever reset, exactly like the HYDRA-UMC-UPDATER pin
      # above already documents.
      # -----------------------------------------------------------------------
      - name: Install URTC-UPDATER and ARMOR-UPDATER
        run: |
          python -m pip install "git+https://github.com/JuanenRac/URTC-UPDATER.git@333cdec0c4636a1c006b72a8f20235b2537d1de4"
          python -m pip install "git+https://github.com/JuanenRac/ARMOR-UPDATER.git@39b19e1e58db9c2d521f035b6a0ebe5f71ba4f1d"

      # -----------------------------------------------------------------------
      # Generate dashboard
      # -----------------------------------------------------------------------
      - name: Check the ecosystem catalog against the dashboard
        run: |
          python -m unittest discover -s tests -v

      - name: Generate dashboard
        env:
          # Used only to read PUBLIC commit/Actions-run metadata on the
          # other repos in this same GitHub account via api.github.com
          # (raw.githubusercontent.com, used for version lookups, does not
          # need it). Passing it raises the rate limit from 60/hour to
          # ~5000/hour; the script still works, just with less metadata,
          # if this is ever unset.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_dashboard.py

      # -----------------------------------------------------------------------
      # Sync README project-catalog versions
      # -----------------------------------------------------------------------
      # scripts/sync_readme_versions.py was a real, working script long
      # before this step existed - it just could only ever run on a
      # developer machine with every ecosystem repository checked out as a
      # sibling of this one, which this runner never has (fetch-depth: 1
      # of this repository alone). It now fetches each repository's own
      # manifest from raw.githubusercontent.com when no local sibling
      # exists, the same fallback generate_dashboard.py's own manifest
      # lookup already uses, so it runs here exactly like the dashboard
      # generation step above.
      # -----------------------------------------------------------------------
      - name: Sync README project versions
        run: |
          python scripts/sync_readme_versions.py

      # The Description column of the same tables, and the "Catalogue and versions"
      # status row, come from one checked file (ecosystem-descriptions.json) in the
      # eight languages. The write step keeps the READMEs current; the check step
      # fails the run when a listed repository has no description in any language
      # or the source holds an entry no table lists.
      - name: Sync README project descriptions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/sync_readme_descriptions.py

      - name: Check README project descriptions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/sync_readme_descriptions.py --check

      # The progress bar of every ecosystem is calculated from the maturity and
      # the evidence each repository declares in its own manifest (see
      # scripts/ecosystem_progress.py), never typed by hand.
      - name: Calculate the progress of the ecosystems
        env:
          # Reads the tags, the files and the last runs of every repository of the account
          # (public data); without the token the limit of 60 requests an hour is reached at once.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/ecosystem_progress.py

      # The "Ecosystem status" table of every ecosystem (one line per area with its light,
      # a bar and the count behind it) is written from the same real facts, never by hand.
      - name: Calculate the status of the ecosystems
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/ecosystem_status.py

      # -----------------------------------------------------------------------
      # Show generated files
      # -----------------------------------------------------------------------
      - name: Show dashboard status
        run: |
          echo "Generated dashboard:"
          ls -lah docs/
          echo
          echo "Git status:"
          git status --short

      # -----------------------------------------------------------------------
      # Reconcile the figures of the ecosystem
      # -----------------------------------------------------------------------
      # Inventory, manifests, the README and its seven translations, the catalogue,
      # the dashboard just generated and the progress numbers are compared, and each
      # figure is explained in the job summary. The step never turns an unreadable
      # source into "healthy"; a real incoherence is a warning here (it lives in
      # other repositories and must not stop the dashboard that reports it), and
      # the tool itself exits with a code other than 0.
      - name: Reconcile the figures of the ecosystem
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set +e
          python scripts/ecosystem_integrity_test.py --json "$RUNNER_TEMP/integrity-report.json"
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::warning title=Ecosystem integrity::The reconciliation found incoherences or could not verify the sources (exit code $code). See the job summary."
          fi
          exit 0

      # -----------------------------------------------------------------------
      # Hand the generated files to the publishing job (never on a pull request)
      # -----------------------------------------------------------------------
      # The generated docs/index.html and docs/.nojekyll, the seven version-synced
      # READMEs and the daily snapshot are saved BEFORE git is touched, so a retry
      # of the publishing job can re-apply the exact same already-computed output
      # onto a freshly re-fetched main - never regenerating (and never re-hitting
      # the GitHub API) partway through a retry.
      - name: Collect the generated files
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/dashboard-out"
          mkdir -p "$out/extras/data" "$out/extras/docs"
          cp docs/index.html "$out/index.html"
          cp docs/.nojekyll "$out/nojekyll"
          for extra in data/history.json data/actions-cache.json data/delivery-cache.json data/sentinel.json docs/og-image.png; do
            if [ -f "$extra" ]; then cp "$extra" "$out/extras/$extra"; fi
          done
          for readme in README.md README_spa.md README_fra.md README_ita.md README_deu.md README_zho.md README_jpn.md README_por.md; do
            cp "$readme" "$out/$readme"
          done

      - name: Keep the generated files for the publishing job
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dashboard-out
          path: ${{ runner.temp }}/dashboard-out
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Publish: the only job that may write to the repository
  # ---------------------------------------------------------------------------
  # GitHub Pages publishes from the branch main (folder /docs), so committing to main
  # is the whole deployment: no Pages permission and no OIDC token are needed.
  # CAT-01 (P2): the concurrency group above only ever serialized two runs of THIS
  # SAME workflow against each other - it does nothing for a genuine human push to
  # main landing between this job's checkout and its own push, which used to just
  # fail outright (a real non-fast-forward rejection) and silently lose this run's
  # regenerated dashboard until the next scheduled hour; the retry loop below
  # re-fetches main and re-applies the saved output.
  publish:
    name: Publish the dashboard
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Fetch the generated files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dashboard-out
          path: ${{ runner.temp }}/dashboard-out

      # Commit only when the generated dashboard actually changed.
      - name: Commit dashboard if changed
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          readmes=(README.md README_spa.md README_fra.md README_ita.md README_deu.md README_zho.md README_jpn.md README_por.md)
          workdir="$RUNNER_TEMP/dashboard-out"
          extras=(data/history.json data/actions-cache.json data/delivery-cache.json data/sentinel.json docs/og-image.png)

          max_attempts=5
          for attempt in $(seq 1 "$max_attempts"); do
            git fetch origin main
            git reset --hard origin/main
            cp "$workdir/index.html" docs/index.html
            cp "$workdir/nojekyll" docs/.nojekyll
            mkdir -p data
            for extra in "${extras[@]}"; do
              if [ -f "$workdir/extras/$extra" ]; then cp "$workdir/extras/$extra" "$extra"; fi
            done
            for readme in "${readmes[@]}"; do
              cp "$workdir/$readme" "$readme"
            done
            git add docs/index.html docs/.nojekyll "${readmes[@]}"
            for extra in "${extras[@]}"; do
              if [ -f "$extra" ]; then git add "$extra"; fi
            done

            if git diff --cached --quiet; then
              echo "No dashboard/README changes detected against the current main."
              echo "Nothing to commit."
              exit 0
            fi

            git commit -m "docs: regenerate ecosystem status dashboard and sync README versions"

            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt/$max_attempts."
              exit 0
            fi

            echo "Push rejected (attempt $attempt/$max_attempts) - main moved concurrently, re-fetching and retrying."
          done

          echo "::error::Could not push the regenerated dashboard/READMEs after $max_attempts attempts - main kept moving concurrently. No content was lost (still sitting in $workdir); re-run this workflow." >&2
          exit 1
