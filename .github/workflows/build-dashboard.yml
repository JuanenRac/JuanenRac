# GPL-3.0 - see LICENSE.md
#
# Builds the central ecosystem status dashboard and publishes it through
# GitHub Pages from main/docs.
#
# Architecture:
#
#   github_client.py
#        |
#        v
#   generate_dashboard.py
#        |
#        v
#   docs/index.html
#        |
#        v
#   GitHub Pages
#
# Each repository's hydra-umc.project.json is the single source of truth for
# its metadata and version. The workflow discovers GitHub repositories at
# runtime; it contains no project list.
#
# The generated HTML deliberately contains no generation timestamp. This is
# important: if a timestamp were written on every scheduled execution, the
# generated file would always change and this workflow would create an
# unnecessary commit every day even when nothing in the ecosystem changed.
#
# GitHub Pages:
#
#   Repository Settings
#   -> Pages
#   -> Source: Deploy from a branch
#   -> Branch: main
#   -> Folder: /docs
#
# Live page:
#
#   https://juanenrac.github.io/JuanenRac/
# =============================================================================

name: Build ecosystem status dashboard

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "scripts/generate_dashboard.py"
      - "ecosystem-catalog.json"
      - ".github/workflows/build-dashboard.yml"

  schedule:
    # Hourly discovery: a newly pushed manifest repository appears without
    # editing this repository or maintaining a dashboard project list.
    - cron: "17 * * * *"

# Prevent two dashboard builds from modifying main at the same time.
concurrency:
  group: ecosystem-dashboard
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Generate ecosystem dashboard
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # Checkout
      # -----------------------------------------------------------------------
      # checkout v6 runs on Node.js 24 and avoids the old Node.js 20 warning.
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # -----------------------------------------------------------------------
      # Python
      # -----------------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # -----------------------------------------------------------------------
      # Install the ecosystem updater
      # -----------------------------------------------------------------------
      # The updater supplies the shared manifest parser and dynamic GitHub
      # discovery implementation. No project catalogue is installed here.
      # -----------------------------------------------------------------------
      - name: Install HYDRA-UMC-UPDATER
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/JuanenRac/HYDRA-UMC-UPDATER.git"

      # -----------------------------------------------------------------------
      # Generate dashboard
      # -----------------------------------------------------------------------
      - name: Generate dashboard
        env:
          # Used only to read PUBLIC commit/Actions-run metadata on the
          # other repos in this same GitHub account via api.github.com
          # (raw.githubusercontent.com, used for version lookups, does not
          # need it). Passing it raises the rate limit from 60/hour to
          # ~5000/hour; the script still works, just with less metadata,
          # if this is ever unset.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_dashboard.py

      # -----------------------------------------------------------------------
      # Show generated files
      # -----------------------------------------------------------------------
      - name: Show dashboard status
        run: |
          echo "Generated dashboard:"
          ls -lah docs/
          echo
          echo "Git status:"
          git status --short

      # -----------------------------------------------------------------------
      # Commit only when the generated dashboard actually changed
      # -----------------------------------------------------------------------
      - name: Commit dashboard if changed
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/index.html docs/.nojekyll

          if git diff --cached --quiet; then
            echo "No dashboard changes detected."
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "docs: regenerate ecosystem status dashboard"

          # The concurrency group prevents two executions of this workflow
          # from pushing simultaneously.
          git push
