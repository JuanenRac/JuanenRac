name: Seed HYDRA-UMC Roadmap

on:
  workflow_dispatch:
    inputs:
      roadmap:
        description: Which board - hydra-umc, urtc, armor or eh3d.
        required: true
        default: hydra-umc
        type: choice
        options:
          - hydra-umc
          - urtc
          - armor
          - eh3d
      apply:
        description: Add missing evidence-based planning items to the Roadmap.
        required: true
        default: false
        type: boolean
      reconcile_status:
        description: Also apply the board's explicit status decisions, renames and refreshed text to cards that already exist (only the listed ones).
        required: true
        default: false
        type: boolean

permissions: {}

jobs:
  seed:
    name: Seed missing ecosystem planning items
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Roadmap automation source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: |
            tools/bootstrap_ecosystem_project.py
            tools/roadmap_defs.py
            tools/seed_ecosystem_roadmap.py
          sparse-checkout-cone-mode: false
      - name: Seed evidence-based work
        env:
          HYDRA_UMC_PROJECTS_TOKEN: ${{ secrets.HYDRA_UMC_PROJECTS_TOKEN }}
          ROADMAP: ${{ inputs.roadmap }}
          APPLY: ${{ inputs.apply }}
          RECONCILE_STATUS: ${{ inputs.reconcile_status }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HYDRA_UMC_PROJECTS_TOKEN" || {
            echo '::error::HYDRA_UMC_PROJECTS_TOKEN is not configured.'
            exit 1
          }
          args=(--roadmap "$ROADMAP")
          if [[ "$APPLY" == 'true' ]]; then
            args+=(--apply)
          fi
          if [[ "$RECONCILE_STATUS" == 'true' ]]; then
            args+=(--reconcile-status)
          fi
          python3 tools/seed_ecosystem_roadmap.py "${args[@]}"
