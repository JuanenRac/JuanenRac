#
# Reusable workflow: static analysis of the GitHub Actions workflows of the
# calling repository with zizmor (https://docs.zizmor.sh).
#
# How a repository uses it (a few lines in its own .github/workflows/zizmor.yml):
#
#   name: zizmor
#   on:
#     pull_request:
#       paths: [".github/workflows/**", ".github/actions/**", ".github/zizmor.yml"]
#     push:
#       branches: [main]
#       paths: [".github/workflows/**", ".github/actions/**", ".github/zizmor.yml"]
#   permissions: {}
#   jobs:
#     zizmor:
#       permissions:
#         contents: read
#       uses: JuanenRac/JuanenRac/.github/workflows/zizmor.yml@<full commit SHA> # <tag or branch it was read from>
#
# Behaviour:
#   - Only findings at or above `min-severity` (default: high) make the job
#     fail. The findings below it never fail the job: they are listed as a
#     warning in the Job Summary so that they can be fixed at leisure.
#   - Offline and deterministic: no online audit, no secret, no cache, no
#     upload to Code Scanning (so no security-events permission is needed).
#   - No third-party action: zizmor is installed from PyPI with its version and
#     the hashes of its wheels written here (the hashes belong to the version),
#     so a new release of the analyzer cannot turn a repository red by itself.
#     It is raised in this one file, by pull request, after measuring the
#     findings of every repository, and it works in repositories that only
#     allow the actions of GitHub itself.
#   - A finding that was reviewed and accepted is ignored where it lives, with
#     the reason next to it: `# zizmor: ignore[rule-id] reason` on the line, or a
#     `.github/zizmor.yml` (passed in `config`) in the calling repository.
# =============================================================================

name: zizmor (reusable)

on:
  workflow_call:
    inputs:
      min-severity:
        description: "Lowest severity that fails the job: informational, low, medium or high."
        type: string
        default: "high"
      persona:
        description: "zizmor persona: regular, pedantic or auditor."
        type: string
        default: "regular"
      config:
        description: "Path of a zizmor configuration file in the calling repository (empty: the default lookup)."
        type: string
        default: ""
      target:
        description: "What zizmor analyzes, relative to the root of the calling repository."
        type: string
        default: "."

# No permission by default: the job asks for exactly what it needs.
permissions: {}

jobs:
  zizmor:
    name: Analyze the workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      MIN_SEVERITY: ${{ inputs.min-severity }}
      PERSONA: ${{ inputs.persona }}
      CONFIG_PATH: ${{ inputs.config }}
      TARGET: ${{ inputs.target }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1

      # The version and the hashes go together: a new version needs its own hashes (pip refuses anything else).
      - name: Install zizmor 1.32.0
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/zizmor-requirements.txt" <<'EOF'
          zizmor==1.32.0 \
              --hash=sha256:0a999c98015becd9f69919ce01febadfb1c2be9b8ec2ce9ef7eb13ff23ba8eba \
              --hash=sha256:0cdd38fca6eb34ceb567548548d706332e3535ea66894b9168c048e03207b68c \
              --hash=sha256:3f404b26791ed06a5ea9eaa0bfd5b973fc5228bac7db8b3c5ec7f0c7ad2ed16d \
              --hash=sha256:84a6acb975accc13408786a2bd274b572537ca19c933ebbc13e78f3988562071 \
              --hash=sha256:913fd3943bc1358aa6e23b33fe01cc98bf67af23985258b8fbf24eaa2f8728ea \
              --hash=sha256:9cd1dd7734042f40ca0faa2a31fb4e9033dede620d996af2f903744b8f04fca9 \
              --hash=sha256:aa4b4e216321dd5cf202cd79fc83296468f0eed79d850cd65ac8187a6bbc5496 \
              --hash=sha256:bddcdb0e37d1aa53c9f831c55627a5829d0d552cb0afb4b80fbe16a3a3140366 \
              --hash=sha256:d34dcfa702875202b4163d90ebb9cc5222f3d1a7d4b72bf796d87b5a15b24194 \
              --hash=sha256:dd818f99d833b86cd432d5412d620d936b5df074b33404fff8b67acff55d3259 \
              --hash=sha256:eaedf57859f026a0a7da2a6b574517b1fe01e256c6875b3319a06ee1cee026a7 \
              --hash=sha256:f0b664d394576e08605fe8094e8e992056d74b808f30c0c9ca9ed227001dcf67
          EOF
          python3 -m venv "${RUNNER_TEMP}/zizmor-venv"
          "${RUNNER_TEMP}/zizmor-venv/bin/python" -m pip install --quiet --no-input --disable-pip-version-check \
            --only-binary=:all: --no-deps --require-hashes --requirement "${RUNNER_TEMP}/zizmor-requirements.txt"
          "${RUNNER_TEMP}/zizmor-venv/bin/zizmor" --version

      # The advisory report first (never fails): everything from `low` up, written to the Job Summary.
      - name: Write the summary
        shell: bash
        run: |
          set -u
          args=(--offline --no-exit-codes --color=never "--persona=${PERSONA}" --min-severity=low)
          if [ -n "${CONFIG_PATH}" ]; then args+=("--config=${CONFIG_PATH}"); fi
          report="${RUNNER_TEMP}/zizmor-advisory.txt"
          "${RUNNER_TEMP}/zizmor-venv/bin/zizmor" "${args[@]}" -- "${TARGET}" > "${report}" 2>&1 || true
          {
            echo "## zizmor 1.32.0"
            echo
            echo "Findings at or above \`${MIN_SEVERITY}\` fail the job; the report below lists everything from low severity up as advice."
            echo
            echo '```text'
            tail -c 60000 "${report}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      # The gate: findings at or above the threshold become annotations and fail the job.
      - name: Fail on findings at or above the threshold
        shell: bash
        run: |
          set -u
          args=(--offline --format=github --color=never "--persona=${PERSONA}" "--min-severity=${MIN_SEVERITY}")
          if [ -n "${CONFIG_PATH}" ]; then args+=("--config=${CONFIG_PATH}"); fi
          "${RUNNER_TEMP}/zizmor-venv/bin/zizmor" "${args[@]}" -- "${TARGET}"
