#
# Central synchronization of the ecosystem's common GitHub issue labels.
#
# Source of truth:
#   .github/labels.yml
#
# Destination:
#   55 ecosystem repositories listed below. Static, unlike the dashboard's
#   own dynamic discovery (generate_dashboard.py) - a newly added repo
#   needs an entry here too, not just a real hydra-umc.project.json.
#   Verify this list still matches every repo with a real manifest before
#   trusting the count above: `for d in */; do test -f "$d/hydra-umc.project.json" && echo "$d"; done`
#   run from a sibling checkout of the whole ecosystem, diffed against the
#   matrix below - this exact drift (10 real repos missing: all 8
#   External Automation/Mobile bridges, HYDRA-UMC-OS, HYDRA-UMC-SDK) was
#   found and fixed this way once already.
#
# IMPORTANT:
#   A repository secret named LABELS_SYNC_TOKEN is required.
#
# The workflow intentionally uses the GitHub REST API instead of
# EndBug/label-sync because this workflow runs from the meta-repository
# JuanenRac/JuanenRac while modifying labels in multiple other repositories.
#
# Existing project-specific labels are NEVER deleted.
# Only labels defined in .github/labels.yml are created or updated.
# =============================================================================

name: Sync labels across the ecosystem

on:

  push:
    branches:
      - main
    paths:
      - ".github/labels.yml"
      - ".github/workflows/sync-labels.yml"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview changes without modifying repositories"
        required: false
        default: true
        type: boolean

  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: sync-labels-ecosystem
  cancel-in-progress: false


jobs:

  sync:

    name: sync (${{ matrix.repo }})

    runs-on: ubuntu-latest

    strategy:

      fail-fast: false

      max-parallel: 4

      matrix:

        repo:

          # -------------------------------------------------------------------
          # HYDRA-UMC / URTC ecosystem repositories
          # -------------------------------------------------------------------

          - HYDRA-UMC
          - HYDRA-UMC-OS
          - HYDRA-UMC-SDK
          - HYDRA-UMC-SERVER
          - HYDRA-UMC-STUDIO
          - HYDRA-UMC-SUITE
          - HYDRA-UMC-DSI
          - HYDRA-UMC-ANDROID-CONTROL
          - HYDRA-UMC-IOS-CONTROL
          - HYDRA-UMC-EDITOR-URDF
          - URTC
          - URTC-FLASHER
          - URTC-TESTER
          - URTC-WEB-STUDIO
          - HYDRA-UMC-VISION-NODE
          - HYDRA-UMC-VISION-STREAMER
          - HYDRA-UMC-DETECTION-HEF
          - HYDRA-UMC-SAFETY-ZONES
          - HYDRA-UMC-VISUAL-SERVOING-API
          - HYDRA-UMC-COGNITIVE-NODE
          - HYDRA-UMC-VLA-ENGINE
          - HYDRA-UMC-VOICE-UI
          - HYDRA-UMC-SEMANTIC-PLANNER
          - HYDRA-UMC-DOCS-QA
          - HYDRA-UMC-ORCHESTRATOR
          - HYDRA-UMC-SWARM-SYNC
          - HYDRA-UMC-PATH-PLANNER-3D
          - HYDRA-UMC-JOB-DISPATCHER
          - HYDRA-UMC-NODE-HEALING
          - HYDRA-UMC-TWIN
          - HYDRA-UMC-PHYSICS-REPLICA
          - HYDRA-UMC-HIL-BRIDGE
          - HYDRA-UMC-SYNTHETIC-DATA-GEN
          - HYDRA-UMC-DATALAKE
          - HYDRA-UMC-TELEMETRY-COLLECTOR
          - HYDRA-UMC-ANOMALY-DETECTOR
          - HYDRA-UMC-PRODUCTION-REPORTS
          - HYDRA-UMC-GATEWAY-INDUSTRIAL
          - HYDRA-UMC-OPCUA-SERVER
          - HYDRA-UMC-MQTT-BROKER
          - HYDRA-UMC-MTCONNECT-ADAPTER
          - HYDRA-UMC-DASHBOARD-AI
          - URTC-SMART-RACK
          - URTC-VISION-TOOL
          - HYDRA-UMC-WATCH
          - HYDRA-UMC-TOOL-CLI
          - HYDRA-UMC-UPDATER

          # -------------------------------------------------------------------
          # External Automation / Mobile & Autonomous Bridges
          # -------------------------------------------------------------------

          - HYDRA-UMC-BRIDGE-CNC
          - HYDRA-UMC-BRIDGE-LASER
          - HYDRA-UMC-BRIDGE-PRINTER3D
          - HYDRA-UMC-BRIDGE-OPENPNP
          - HYDRA-UMC-BRIDGE-ROS2
          - HYDRA-UMC-BRIDGE-AMR
          - HYDRA-UMC-BRIDGE-UAV
          - HYDRA-UMC-BRIDGE-DROIDS


    steps:

      # =======================================================================
      # Checkout only the central label configuration
      # =======================================================================

      - name: Checkout label configuration

        uses: actions/checkout@v4

        with:
          sparse-checkout: |
            .github/labels.yml
          sparse-checkout-cone-mode: false


      # =======================================================================
      # Validate configuration
      # =======================================================================

      - name: Validate label configuration

        shell: bash

        run: |

          set -euo pipefail

          if [ ! -f ".github/labels.yml" ]; then

            echo "::error::.github/labels.yml was not found."

            exit 1

          fi

          echo "Central label configuration found."

          echo "Target repository:"
          echo "  JuanenRac/${{ matrix.repo }}"


      # =======================================================================
      # Install YAML parser
      # =======================================================================

      - name: Install YAML parser

        shell: bash

        run: |

          python3 -m pip install \
            --disable-pip-version-check \
            --quiet \
            pyyaml


      # =======================================================================
      # Synchronize labels
      # =======================================================================

      - name: Synchronize labels

        env:

          GH_TOKEN: ${{ secrets.LABELS_SYNC_TOKEN }}

          TARGET_REPO: JuanenRac/${{ matrix.repo }}

          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}

        shell: bash

        run: |

          set -euo pipefail


          # -------------------------------------------------------------------
          # Token validation
          # -------------------------------------------------------------------

          if [ -z "${GH_TOKEN}" ]; then

            echo "::error::LABELS_SYNC_TOKEN is not configured."

            echo ""
            echo "Create the repository secret:"
            echo "  LABELS_SYNC_TOKEN"

            echo ""
            echo "GitHub:"
            echo "  Settings"
            echo "  -> Secrets and variables"
            echo "  -> Actions"

            exit 1

          fi


          echo "============================================================"
          echo "HYDRA-UMC / URTC LABEL SYNCHRONIZATION"
          echo "============================================================"
          echo "Target : ${TARGET_REPO}"
          echo "Dry-run: ${DRY_RUN}"
          echo "============================================================"


          python3 <<'PY'

          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          import yaml


          TOKEN = os.environ["GH_TOKEN"]

          TARGET_REPO = os.environ["TARGET_REPO"]

          DRY_RUN = (
              os.environ["DRY_RUN"].lower() == "true"
          )

          CONFIG_FILE = ".github/labels.yml"

          API_BASE = "https://api.github.com"


          HEADERS = {

              "Accept":
                  "application/vnd.github+json",

              "Authorization":
                  f"Bearer {TOKEN}",

              "X-GitHub-Api-Version":
                  "2022-11-28",

              "User-Agent":
                  "HYDRA-UMC-central-label-sync",
          }


          # ===================================================================
          # GitHub API helper
          # ===================================================================

          def api_request(
              method,
              url,
              payload=None
          ):

              data = None

              headers = dict(HEADERS)


              if payload is not None:

                  data = json.dumps(
                      payload
                  ).encode("utf-8")

                  headers["Content-Type"] = (
                      "application/json"
                  )


              request = urllib.request.Request(

                  url,

                  data=data,

                  headers=headers,

                  method=method
              )


              try:

                  with urllib.request.urlopen(
                      request
                  ) as response:

                      raw = response.read()

                      if not raw:

                          return (
                              response.status,
                              None
                          )

                      return (
                          response.status,
                          json.loads(
                              raw.decode("utf-8")
                          )
                      )


              except urllib.error.HTTPError as error:

                  body = (
                      error.read()
                      .decode(
                          "utf-8",
                          errors="replace"
                      )
                  )

                  print(
                      f"::error::GitHub API "
                      f"HTTP {error.code}: {body}"
                  )

                  raise


          def github_url(path):

              return (
                  f"{API_BASE}{path}"
              )


          # ===================================================================
          # Read labels.yml
          # ===================================================================

          print()
          print(
              "Reading central label configuration..."
          )


          with open(
              CONFIG_FILE,
              "r",
              encoding="utf-8"
          ) as file:

              config = yaml.safe_load(file)


          if not isinstance(
              config,
              list
          ):

              print(
                  "::error::.github/labels.yml "
                  "must contain a YAML list."
              )

              sys.exit(1)


          labels = []


          for index, item in enumerate(config):

              if not isinstance(
                  item,
                  dict
              ):

                  print(
                      "::error::Label entry "
                      f"{index} is invalid."
                  )

                  sys.exit(1)


              name = item.get(
                  "name"
              )

              color = item.get(
                  "color"
              )

              description = item.get(
                  "description",
                  ""
              )


              if not isinstance(
                  name,
                  str
              ) or not name.strip():

                  print(
                      "::error::Label entry "
                      f"{index} has no valid name."
                  )

                  sys.exit(1)


              if not isinstance(
                  color,
                  str
              ) or not color.strip():

                  print(
                      "::error::Label "
                      f"'{name}' has no valid color."
                  )

                  sys.exit(1)


              color = (
                  color
                  .strip()
                  .lstrip("#")
              )


              if not isinstance(
                  description,
                  str
              ):

                  description = ""


              labels.append({

                  "name":
                      name,

                  "color":
                      color,

                  "description":
                      description,

              })


          print(
              f"Loaded {len(labels)} labels."
          )


          # ===================================================================
          # Read labels from destination repository
          # ===================================================================

          print()

          print(
              f"Reading labels from "
              f"{TARGET_REPO}..."
          )


          destination_labels = []

          page = 1


          while True:

              status, data = api_request(

                  "GET",

                  github_url(
                      f"/repos/{TARGET_REPO}/labels"
                      f"?per_page=100&page={page}"
                  )

              )


              if not isinstance(
                  data,
                  list
              ):

                  print(
                      "::error::Unexpected "
                      "GitHub API response."
                  )

                  sys.exit(1)


              destination_labels.extend(
                  data
              )


              if len(data) < 100:

                  break


              page += 1


          existing = {

              label["name"]:
                  label

              for label
              in destination_labels

          }


          print(
              f"Found "
              f"{len(destination_labels)} "
              f"existing labels."
          )


          # ===================================================================
          # Synchronization
          # ===================================================================

          created = 0

          updated = 0

          unchanged = 0


          for label in labels:

              name = label["name"]

              desired_color = (
                  label["color"]
              )

              desired_description = (
                  label["description"]
              )


              # ----------------------------------------------------------------
              # CREATE
              # ----------------------------------------------------------------

              if name not in existing:

                  print(
                      f"[CREATE] {name}"
                  )


                  if not DRY_RUN:

                      api_request(

                          "POST",

                          github_url(
                              f"/repos/"
                              f"{TARGET_REPO}/labels"
                          ),

                          {

                              "name":
                                  name,

                              "color":
                                  desired_color,

                              "description":
                                  desired_description,

                          }

                      )


                  created += 1

                  continue


              # ----------------------------------------------------------------
              # UPDATE
              # ----------------------------------------------------------------

              current = existing[name]


              current_color = (
                  current.get(
                      "color",
                      ""
                  )
                  .lstrip("#")
                  .lower()
              )


              current_description = (
                  current.get(
                      "description",
                      ""
                  )
                  or ""
              )


              changed = (

                  current_color
                  != desired_color.lower()

                  or

                  current_description
                  != desired_description

              )


              if changed:

                  print(
                      f"[UPDATE] {name}"
                  )


                  if not DRY_RUN:

                      encoded_name = (
                          urllib.parse.quote(
                              name,
                              safe=""
                          )
                      )


                      api_request(

                          "PATCH",

                          github_url(

                              f"/repos/"
                              f"{TARGET_REPO}"
                              f"/labels/"
                              f"{encoded_name}"

                          ),

                          {

                              "new_name":
                                  name,

                              "color":
                                  desired_color,

                              "description":
                                  desired_description,

                          }

                      )


                  updated += 1


              else:

                  print(
                      f"[OK] {name}"
                  )

                  unchanged += 1


          # ===================================================================
          # Summary
          # ===================================================================

          print()

          print(
              "============================================================"
          )

          print(
              "Synchronization summary"
          )

          print(
              "============================================================"
          )

          print(
              f"Repository : {TARGET_REPO}"
          )

          print(
              f"Dry-run    : {DRY_RUN}"
          )

          print(
              f"Created    : {created}"
          )

          print(
              f"Updated    : {updated}"
          )

          print(
              f"Unchanged  : {unchanged}"
          )

          print(
              "============================================================"
          )


          if DRY_RUN:

              print()

              print(
                  "DRY-RUN completed."
              )

              print(
                  "No repository was modified."
              )

          else:

              print()

              print(
                  "Label synchronization completed successfully."
              )

          PY
