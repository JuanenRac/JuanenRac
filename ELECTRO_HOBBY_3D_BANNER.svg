<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Gradiente de Fondo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090C" />
      <stop offset="50%" stop-color="#0E1017" />
      <stop offset="100%" stop-color="#08090C" />
    </linearGradient>

    <!-- Gradientes de Neón -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0088FF" />
    </linearGradient>

    <linearGradient id="amberNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF6D00" />
    </linearGradient>

    <!-- Filtro de Resplandor Neón -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="300" fill="url(#bgGrad)" />

  <!-- Pistas de Circuito de Fondo (PCB Traces) -->
  <g stroke="#1A2332" stroke-width="1.5" fill="none">
    <path d="M 0,60 L 150,60 L 190,100 L 320,100" />
    <path d="M 0,240 L 120,240 L 160,200 L 280,200" />
    <path d="M 880,50 L 1050,50 L 1090,90 L 1200,90" />
    <path d="M 850,250 L 980,250 L 1020,210 L 1200,210" />
  </g>

  <!-- TÍTULO PRINCIPAL -->
  <g transform="translate(65, 55)">
    <text x="0" y="0" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="800" font-size="28" fill="#FFFFFF" letter-spacing="3">ELECTRO HOBBY 3D</text>
    <text x="0" y="22" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="600" font-size="12" fill="#00E5FF" letter-spacing="4">4 INDEPENDENT ENGINEERING ECOSYSTEMS</text>
  </g>

  <!-- GRAFO CENTRAL DE 4 NODOS (HYDRA, URTC, ARMOR, EH3D) -->
  <g transform="translate(180, 185)">
    <!-- Conexiones desde el Núcleo a los 4 Nodos Satélite -->
    <line x1="0" y1="0" x2="0" y2="-45" stroke="#FFB300" stroke-width="2.5" filter="url(#glowSoft)" />
    <line x1="0" y1="0" x2="45" y2="0" stroke="#FFB300" stroke-width="2.5" filter="url(#glowSoft)" />
    <line x1="0" y1="0" x2="0" y2="45" stroke="#FFB300" stroke-width="2.5" filter="url(#glowSoft)" />
    <line x1="0" y1="0" x2="-45" y2="0" stroke="#FFB300" stroke-width="2.5" filter="url(#glowSoft)" />

    <!-- Anillo de Órbita -->
    <circle cx="0" cy="0" r="32" stroke="#00E5FF" stroke-width="1" stroke-dasharray="3 3" fill="none" opacity="0.5" />

    <!-- Nodos Satélite (4 Ecosistemas) -->
    <circle cx="0" cy="-45" r="10" fill="#08090C" stroke="#00E5FF" stroke-width="3" filter="url(#glow)" />
    <circle cx="45" cy="0" r="10" fill="#08090C" stroke="#FFB300" stroke-width="3" filter="url(#glow)" />
    <circle cx="0" cy="45" r="10" fill="#08090C" stroke="#00E676" stroke-width="3" filter="url(#glow)" />
    <circle cx="-45" cy="0" r="10" fill="#08090C" stroke="#00B0FF" stroke-width="3" filter="url(#glow)" />

    <!-- Núcleo Central -->
    <circle cx="0" cy="0" r="16" fill="#0E1017" stroke="#00E5FF" stroke-width="3" filter="url(#glow)" />
    <circle cx="0" cy="0" r="5" fill="#FFB300" />
  </g>

  <!-- CAJAS DE ECOSISTEMAS CON TEXTO ETIQUETADO -->
  <g transform="translate(290, 125)">
    <!-- 1. HYDRA-UMC -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="200" height="48" rx="6" fill="#0E1017" stroke="#00E5FF" stroke-width="1.5" filter="url(#glowSoft)" />
      <circle cx="18" cy="24" r="5" fill="#00E5FF" />
      <text x="34" y="20" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#FFFFFF">HYDRA-UMC</text>
      <text x="34" y="36" font-family="system-ui, sans-serif" font-weight="500" font-size="10" fill="#00E5FF">Robotics Platform</text>
    </g>

    <!-- 2. URTC -->
    <g transform="translate(215, 0)">
      <rect x="0" y="0" width="200" height="48" rx="6" fill="#0E1017" stroke="#FFB300" stroke-width="1.5" filter="url(#glowSoft)" />
      <circle cx="18" cy="24" r="5" fill="#FFB300" />
      <text x="34" y="20" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#FFFFFF">URTC</text>
      <text x="34" y="36" font-family="system-ui, sans-serif" font-weight="500" font-size="10" fill="#FFB300">Tool Subsystem</text>
    </g>

    <!-- 3. A.R.M.O.R. -->
    <g transform="translate(430, 0)">
      <rect x="0" y="0" width="200" height="48" rx="6" fill="#0E1017" stroke="#00E676" stroke-width="1.5" filter="url(#glowSoft)" />
      <circle cx="18" cy="24" r="5" fill="#00E676" />
      <text x="34" y="20" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#FFFFFF">A.R.M.O.R.</text>
      <text x="34" y="36" font-family="system-ui, sans-serif" font-weight="500" font-size="10" fill="#00E676">Perimeter and Home</text>
    </g>

    <!-- 4. EH3D FABRICATION SUITE -->
    <g transform="translate(645, 0)">
      <rect x="0" y="0" width="200" height="48" rx="6" fill="#0E1017" stroke="#00B0FF" stroke-width="1.5" filter="url(#glowSoft)" />
      <circle cx="18" cy="24" r="5" fill="#00B0FF" />
      <text x="34" y="20" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#FFFFFF">EH3D SUITE</text>
      <text x="34" y="36" font-family="system-ui, sans-serif" font-weight="500" font-size="10" fill="#00B0FF">PCB, CAM and CNC</text>
    </g>
  </g>
</svg>