<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with deep industrial gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#07090C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#12161C;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bgGrad)"/>

  <!-- Circuit board aesthetic lines -->
  <path d="M0 100 L200 100 L250 150 L600 150" stroke="#00E5FF" stroke-width="1" fill="none" opacity="0.2"/>
  <path d="M1200 300 L1000 300 L950 250 L600 250" stroke="#00E5FF" stroke-width="1" fill="none" opacity="0.2"/>

  <!-- Central Logo Icon (Abstract Hydra/Robot Arm) -->
  <g transform="translate(600, 180)" filter="url(#glow)">
    <!-- Hydra Heads / Multi-axis representation -->
    <path d="M-60,40 L-80,-20 L-40,-60 L0,-40 L40,-60 L80,-20 L60,40 Z" fill="none" stroke="#00E5FF" stroke-width="4"/>
    <circle cx="0" cy="-40" r="10" fill="#00E5FF"/>
    <circle cx="-40" cy="-60" r="8" fill="#00E5FF"/>
    <circle cx="40" cy="-60" r="8" fill="#00E5FF"/>

    <!-- Base -->
    <rect x="-30" y="40" width="60" height="15" rx="2" fill="#00E5FF" opacity="0.8"/>
  </g>

  <!-- Text Branding -->
  <text x="600" y="280" font-family="Arial, sans-serif" font-size="54" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="8">HYDRA-UMC</text>
  <text x="600" y="325" font-family="Arial, sans-serif" font-size="18" fill="#00E5FF" text-anchor="middle" letter-spacing="4" opacity="0.9">UNIVERSAL MULTI-AXIS CONTROLLER ECOSYSTEM</text>

  <!-- Tech Tags -->
  <g font-family="monospace" font-size="12" fill="#00E5FF" opacity="0.6">
    <text x="100" y="370">#STM32H745</text>
    <text x="250" y="370">#HAILO-AI</text>
    <text x="400" y="370">#FDCAN</text>
    <text x="550" y="370">#NODEJS</text>
    <text x="700" y="370">#REACT</text>
    <text x="850" y="370">#FLUTTER</text>
    <text x="1000" y="370">#PYTHON</text>
  </g>
</svg>
